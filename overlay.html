<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CAC Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1920px;
      height: 1080px;
      background: transparent;
      font-family: 'Arial Black', 'Arial', sans-serif;
      overflow: hidden;
    }

    /* ── CAC Logo watermark ── */
    #logo-wrap {
      position: absolute;
      top: 28px;
      left: 36px;
      opacity: 0.92;
      transition: opacity 0.3s;
    }

    /* ── Timer pill above scorebar ── */
    #timer-wrap {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    #period-label {
      background: #6BDB58;
      color: #000;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 4px 18px 3px;
      border-radius: 4px 4px 0 0;
    }

    #timer-display {
      background: rgba(0, 0, 0, 0.88);
      color: #6BDB58;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 4px;
      padding: 8px 28px;
      border-radius: 0 0 4px 4px;
    }

    /* ── Scoreboard bar ── */
    #scoreboard {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: stretch;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 32px rgba(0,0,0,0.6);
    }

    .team-block {
      background: rgba(10, 10, 10, 0.90);
      padding: 14px 36px;
      min-width: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .team-badge {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6BDB58;
    }

    .home-block .team-badge { background: #6BDB58; }
    .away-block .team-badge { background: #fff; }

    .team-name {
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .score-block {
      background: #6BDB58;
      padding: 14px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .score-num {
      color: #000;
      font-size: 52px;
      font-weight: 900;
      line-height: 1;
      min-width: 44px;
      text-align: center;
    }

    .score-sep {
      color: rgba(0,0,0,0.45);
      font-size: 40px;
      font-weight: 900;
      line-height: 1;
    }

    /* hidden state */
    .hidden { display: none !important; }

    /* goal flash animation */
    @keyframes goalFlash {
      0%   { background: #fff200; }
      50%  { background: #6BDB58; }
      100% { background: #6BDB58; }
    }
    .goal-flash { animation: goalFlash 1.2s ease-out; }
  </style>
</head>
<body>

  <!-- Logo watermark -->
  <div id="logo-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" width="100" height="51" viewBox="0 0 868 440">
      <path fill="#ffffff" d="M143 67 L47 161 L141 256 L168 230 L100 161 L168 93 Z"/>
      <path fill="#6BDB58" fill-rule="evenodd" d="M208 76 L208 327 L247 327 L247 183 L249 181 L635 181 L637 183 L637 327 L675 327 L675 75 Z M247 116 L251 113 L635 113 L637 115 L637 141 L635 143 L249 143 L247 141 Z"/>
      <path fill="#ffffff" d="M741 67 L716 94 L783 160 L716 229 L742 256 L836 160 Z"/>
    </svg>
  </div>

  <!-- Timer -->
  <div id="timer-wrap">
    <div id="period-label">1st Half</div>
    <div id="timer-display">00:00</div>
  </div>

  <!-- Scoreboard -->
  <div id="scoreboard">
    <div class="team-block home-block">
      <div class="team-badge"></div>
      <div class="team-name" id="home-name">CAC</div>
    </div>
    <div class="score-block" id="score-block">
      <span class="score-num" id="home-score">0</span>
      <span class="score-sep">–</span>
      <span class="score-num" id="away-score">0</span>
    </div>
    <div class="team-block away-block">
      <div class="team-badge"></div>
      <div class="team-name" id="away-name">AWAY</div>
    </div>
  </div>

  <script>
    let prevHomeScore = 0;
    let prevAwayScore = 0;

    function updateOverlay() {
      try {
        const raw = localStorage.getItem('cac_overlay');
        if (!raw) return;
        const d = JSON.parse(raw);

        // Team names
        if (d.homeTeam != null) document.getElementById('home-name').textContent = d.homeTeam.toUpperCase();
        if (d.awayTeam != null) document.getElementById('away-name').textContent = d.awayTeam.toUpperCase();

        // Scores + goal flash
        if (d.homeScore != null) {
          const el = document.getElementById('home-score');
          if (d.homeScore > prevHomeScore) goalFlash();
          el.textContent = d.homeScore;
          prevHomeScore = d.homeScore;
        }
        if (d.awayScore != null) {
          const el = document.getElementById('away-score');
          if (d.awayScore > prevAwayScore) goalFlash();
          el.textContent = d.awayScore;
          prevAwayScore = d.awayScore;
        }

        // Timer & period
        if (d.time != null) document.getElementById('timer-display').textContent = d.time;
        if (d.period != null) document.getElementById('period-label').textContent = d.period;

        // Visibility
        const scoreboard = document.getElementById('scoreboard');
        const timerWrap  = document.getElementById('timer-wrap');
        const logoWrap   = document.getElementById('logo-wrap');

        scoreboard.classList.toggle('hidden', d.showScoreboard === false);
        timerWrap.classList.toggle('hidden',   d.showTimer     === false);
        logoWrap.classList.toggle('hidden',    d.showLogo      === false);
      } catch(e) {}
    }

    function goalFlash() {
      const sb = document.getElementById('score-block');
      sb.classList.remove('goal-flash');
      void sb.offsetWidth; // reflow
      sb.classList.add('goal-flash');
      setTimeout(() => sb.classList.remove('goal-flash'), 1300);
    }

    setInterval(updateOverlay, 250);
    updateOverlay();
  </script>
</body>
</html>
